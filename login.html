<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversaciones de Fortalezas Co³ — Ingresar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --violet-deep: #0D0824;
    --violet:      #5B35B5;
    --violet-mid:  #7C3AED;
    --glow:        #A78BFA;
    --lavender:    #C4B5FD;
    --pink:        #D946EF;
    --white:       #FFFFFF;
    --text-muted:  rgba(255,255,255,0.45);
    --border:      rgba(196,181,253,0.15);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; min-height: 100vh;
    font-family: 'Outfit', sans-serif;
    background: var(--violet-deep);
    color: var(--white);
    overflow: hidden;
  }

  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 70% at 50% 30%, rgba(91,53,181,0.32) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 80% 80%, rgba(124,58,237,0.18) 0%, transparent 50%),
      radial-gradient(ellipse 50% 40% at 10% 60%, rgba(167,139,250,0.1) 0%, transparent 50%),
      linear-gradient(180deg, #0D0824 0%, #150B35 50%, #0D0824 100%);
  }
  canvas#canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  .blob {
    position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none;
  }
  .blob-1 { width: 700px; height: 700px; top: -200px; left: -200px; background: rgba(91,53,181,0.22); animation: drift1 22s ease-in-out infinite alternate; }
  .blob-2 { width: 500px; height: 500px; bottom: -150px; right: -150px; background: rgba(167,139,250,0.14); animation: drift2 18s ease-in-out infinite alternate; }
  .blob-3 { width: 300px; height: 300px; top: 40%; left: 40%; background: rgba(217,70,239,0.08); animation: drift3 14s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(80px, 60px) scale(1.12); } }
  @keyframes drift2 { to { transform: translate(-60px, -80px) scale(1.1); } }
  @keyframes drift3 { to { transform: translate(-40px, 40px) scale(1.15); } }

  .wrapper {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%; max-width: 420px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 28px;
    padding: 52px 44px 48px;
    backdrop-filter: blur(20px);
    box-shadow: 0 40px 100px rgba(0,0,0,0.5), 0 0 60px rgba(91,53,181,0.2);
    animation: cardIn 1s cubic-bezier(.22,.68,0,1.2) forwards;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .logo-wrap {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 40px;
    opacity: 0; transform: translateY(16px);
    animation: revealUp 0.7s ease forwards 0.35s;
  }
  .logo-icon { width: 44px; height: 44px; }
  .logo-name {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--lavender); line-height: 1.6;
  }
  .logo-sup { font-size: 8px; vertical-align: super; }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300; font-style: italic;
    font-size: 28px; line-height: 1.25;
    color: var(--white);
    margin-bottom: 0;
    opacity: 0; transform: translateY(16px);
    animation: revealUp 0.8s ease forwards 0.55s;
  }
  .tagline em {
    background: linear-gradient(135deg, var(--lavender), var(--pink));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    font-style: italic;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(196,181,253,0.2), transparent);
    margin: 32px 0 28px;
    opacity: 0; animation: revealFade 0.8s ease forwards 0.75s;
  }

  .form { display: flex; flex-direction: column; gap: 16px; }
  .field {
    display: flex; flex-direction: column; gap: 7px;
    opacity: 0; transform: translateY(12px);
  }
  .field:nth-child(1) { animation: revealUp 0.6s ease forwards 0.85s; }
  .field:nth-child(2) { animation: revealUp 0.6s ease forwards 1.05s; }

  label {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--lavender); font-weight: 400;
  }
  input {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(196,181,253,0.18);
    border-radius: 12px; padding: 14px 18px;
    font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 300; color: var(--white);
    outline: none;
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  input::placeholder { color: rgba(255,255,255,0.25); }
  input:focus {
    border-color: rgba(167,139,250,0.5);
    background: rgba(255,255,255,0.07);
    box-shadow: 0 0 0 3px rgba(167,139,250,0.1);
  }

  .btn-wrap {
    margin-top: 28px;
    opacity: 0; transform: translateY(12px);
    animation: revealUp 0.6s ease forwards 1.25s;
  }
  .btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, var(--violet) 0%, var(--violet-mid) 100%);
    border: none; border-radius: 14px;
    color: var(--white); font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 400; letter-spacing: 0.06em;
    cursor: pointer; position: relative; overflow: hidden;
    box-shadow: 0 12px 40px rgba(91,53,181,0.45), 0 2px 8px rgba(0,0,0,0.3);
    transition: transform 0.3s cubic-bezier(.22,.68,0,1.2), box-shadow 0.3s;
  }
  .btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, transparent 50%);
    opacity: 0; transition: opacity 0.3s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 48px rgba(91,53,181,0.55), 0 4px 16px rgba(0,0,0,0.35); }
  .btn:hover::before { opacity: 1; }
  .btn:active { transform: translateY(0px); }

  .btn.loading .btn-text { opacity: 0; }
  .btn.loading .btn-loader { opacity: 1; }
  .btn-text { transition: opacity 0.2s; }
  .btn-loader {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: var(--white);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .forgot {
    display: block; text-align: center; margin-top: 20px;
    font-size: 12px; color: var(--text-muted);
    text-decoration: none; letter-spacing: 0.04em;
    opacity: 0; animation: revealUp 0.6s ease forwards 1.4s;
    transition: color 0.2s;
  }
  .forgot:hover { color: var(--lavender); }

  .overlay {
    position: fixed; inset: 0; z-index: 100;
    background: var(--violet-deep);
    opacity: 0; pointer-events: none;
    transition: opacity 0.6s ease;
  }
  .overlay.active { opacity: 1; pointer-events: all; }

  .bottom-text {
    position: fixed; bottom: 24px; left: 0; right: 0;
    text-align: center; font-size: 11px;
    color: rgba(255,255,255,0.18); letter-spacing: 0.12em;
    z-index: 10; opacity: 0;
    animation: revealFade 1s ease forwards 1.8s;
  }

  @keyframes revealUp   { to { opacity: 1; transform: translateY(0); } }
  @keyframes revealFade { to { opacity: 1; } }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="bg"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<div class="wrapper">
  <div class="card">
    <div class="logo-wrap">
      <svg class="logo-icon" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#C4B5FD"/>
            <stop offset="100%" stop-color="#7C3AED"/>
          </linearGradient>
          <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path d="M28 4 L48 16 L48 40 L28 52 L8 40 L8 16 Z" stroke="url(#lg1)" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.7"/>
        <path d="M28 12 L40 24 L28 36 L16 24 Z" stroke="url(#lg1)" stroke-width="1.2" fill="none"/>
        <path d="M28 20 C28 20 24 23 24 26 C24 28.2 25.8 30 28 30 C30.2 30 32 28.2 32 26 C32 23 28 20 28 20Z" fill="url(#lg1)" opacity="0.9"/>
        <path d="M18 36 Q18 42 24 42 L34 42 Q40 42 40 36 Q40 30 34 30 L22 30 Q18 30 18 36Z" stroke="rgba(196,181,253,0.3)" stroke-width="1" fill="none"/>
      </svg>
      <div class="logo-name">
        Conversaciones<br>de Fortalezas Co<sup class="logo-sup">3</sup>
      </div>
    </div>

    <h1 class="tagline">Una conversación<br>puede cambiarlo <em>todo.</em></h1>

    <div class="divider"></div>

    <div class="form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" autocomplete="email">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
    </div>

    <div class="btn-wrap">
      <button class="btn" id="loginBtn" onclick="handleLogin()">
        <span class="btn-text">Ingresar</span>
        <span class="btn-loader"><div class="spinner"></div></span>
      </button>
    </div>

    <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
  </div>
</div>

<p class="bottom-text">© 2025 Karen Pérez Molina · Mujer Apreciativa</p>
<div class="overlay" id="overlay"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, particles = [];
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);

class Particle {
  constructor() { this.reset(true); }
  reset(init) {
    this.x = Math.random() * W;
    this.y = init ? Math.random() * H : H + 10;
    this.r = Math.random() * 1.8 + 0.4;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = -(Math.random() * 0.4 + 0.1);
    this.alpha = Math.random() * 0.5 + 0.1;
    this.pulse = Math.random() * Math.PI * 2;
  }
  update() {
    this.x += this.vx; this.y += this.vy; this.pulse += 0.02;
    this.alpha = (Math.sin(this.pulse) * 0.15 + 0.25) * (this.r / 2);
    if (this.y < -10) this.reset(false);
  }
  draw() {
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(196,181,253,${this.alpha})`; ctx.fill();
  }
}
for (let i = 0; i < 80; i++) particles.push(new Particle());
function animate() { ctx.clearRect(0, 0, W, H); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animate); }
animate();

// ── LOGIN — REDIRECCIÓN CORREGIDA A INDEX.HTML ──
function handleLogin() {
  const btn = document.getElementById('loginBtn');
  
  // Evita ejecuciones duplicadas si se hace clic muchas veces
  if (btn.classList.contains('loading')) return;
  
  btn.classList.add('loading');
  
  setTimeout(() => {
    const overlay = document.getElementById('overlay');
    if (overlay) overlay.classList.add('active');
    
    setTimeout(() => {
      // Solución al error 404: Se redirige al index.html que contiene la estructura del Home
      window.location.href = 'index.html';
    }, 700);
  }, 1400);
}

document.addEventListener('keydown', e => { 
  if (e.key === 'Enter') {
    // Evita enviar el formulario repetidamente con la tecla enter
    const btn = document.getElementById('loginBtn');
    if (!btn.classList.contains('loading')) {
      handleLogin(); 
    }
  }
});
</script>
</body>
</html>
